name: Source Of Truth Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-architecture:
    name: source-of-truth-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate runtime adapters
        run: node scripts/generate.js

      - name: Check adapter drift
        run: |
          if ! git diff --exit-code --name-only; then
            echo "::error::Runtime adapters are out of sync with canonical src. Run 'node scripts/generate.js' and commit the changes."
            git diff --stat
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Quality (complexity, layer boundaries)
        run: npm run quality

      - name: SAST
        run: npm run sast

      - name: SCA
        run: npm run sca

      - name: Full test suite with coverage threshold
        run: npm run coverage

      - name: Smoke test
        run: npm run smoke

      - name: Verify npm package contents
        run: npm run pack:verify

      - name: Package release artifact
        run: npm run release:artifacts

      - name: Verify release artifact
        run: npm run release:verify-artifacts
